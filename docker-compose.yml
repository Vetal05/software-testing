# Postgres для локального запуску API (параметри збігаються з appsettings.json)
# Запуск: docker compose up -d
# Зупинка: docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: news-aggregator-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: news_aggregator
    ports:
      - "5432:5432"
    volumes:
      - news_aggregator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  news_aggregator_pgdata:
